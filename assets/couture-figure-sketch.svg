    <path d="M165,116 C172,124 188,124 195,116" stroke-width="0.8" stroke="#888888" />
  </g>

  <!-- Measurement Dashed Lines & Labels -->
  <g stroke="#18181b" stroke-width="0.9" stroke-dasharray="2.5,2.5" fill="none">
    <!-- 1. Neck to Shoulder -->
    <line x1="174" y1="74" x2="216" y2="74" />
    <line x1="216" y1="74" x2="242" y2="74" />

    <!-- 2. Chest -->
    <line x1="147" y1="120" x2="213" y2="120" />
    <line x1="213" y1="120" x2="242" y2="120" />

    <!-- 3. Waist -->
    <line x1="152" y1="168" x2="208" y2="168" />
    <line x1="208" y1="168" x2="242" y2="168" />

    <!-- 4. Hip -->
    <line x1="148" y1="212" x2="212" y2="212" />
    <line x1="212" y1="212" x2="242" y2="212" />

    <!-- 5. Sleeve Length -->
    <line x1="216" y1="92" x2="235" y2="198" stroke-dasharray="2,2" />
    <line x1="235" y1="198" x2="242" y2="212" />
  </g>

  <!-- Labels -->
  <g font-family="'Montserrat', sans-serif" font-size="8.5" fill="#27272a" font-weight="400" letter-spacing="0.2">
    <text x="246" y="77">Neck to shoulder</text>
    <text x="246" y="123">Chest</text>
    <text x="246" y="171">Waist</text>
